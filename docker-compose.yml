version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: preflow-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/app/uploads
      - app_data:/app/data
    environment:
      - NODE_ENV=production
    networks:
      - preflow-network

 
networks:
  preflow-network:
    driver: bridge

volumes:
  app_data:
  # postgres_data: