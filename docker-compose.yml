version: '3.8'
services:
  app:
    image: adkmboi/preflow-app:latest
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    ports:
      - "5000:5000"
    volumes:
      - app_data:/app/data
    networks:
      - my_stack_preflow-network  # Use the full prefixed name here
      
networks:
  my_stack_preflow-network:  # Use the full prefixed name here
    external: true           # Tell Docker this network already exists
    
volumes:
  app_data
