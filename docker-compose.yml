version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/app/uploads
      - app_data:/app/data
    environment:
      - NODE_ENV=production
    networks:
      - preflow-network

networks:
  preflow-network:
    driver: overlay   # Changed from 'bridge' to 'overlay' for Docker Swarm compatibility
    attachable: true  # Allows containers in Swarm mode to attach to this network

volumes:
  app_data:
