version: '3.8'

services:
  app:
    image: adkmboi/preflow-app:latest  # Pre-built image
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    ports:
      - "5000:5000"
    volumes:
      - app_data:/app/data              # Named volumes only
    networks:
      - preflow-network

networks:
  preflow-network:
    driver: overlay

volumes:
  app_data:
