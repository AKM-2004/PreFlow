version: '3.8'

services:
  app:
    image: your-username/your-image:tag  # ⚠️ Replace with your built image
    deploy:                             # Swarm-specific configuration
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 3
    ports:
      - "5000:5000"
    volumes:
      - uploads_volume:/app/uploads     # Better to use named volumes
      - app_data:/app/data
    environment:
      - NODE_ENV=production
    networks:
      - preflow-network

networks:
  preflow-network:
    driver: overlay

volumes:
  app_data:
  uploads_volume:                       # Added named volume for uploads
