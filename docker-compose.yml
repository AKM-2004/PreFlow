version: '3.8'

services:
  app:
    image: adkmboi/preflow-app:latest  # Build separately, don't build inside stack
    ports:
      - "5000:5000"
    volumes:
      - uploads:/app/uploads
      - app_data:/app/data
    environment:
      - NODE_ENV=production
    networks:
      - preflow-network

networks:
  preflow-network:
    driver: overlay
    attachable: true

volumes:
  uploads:
  app_data:
